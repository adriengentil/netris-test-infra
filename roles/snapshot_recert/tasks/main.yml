---
- name: Set SSH command prefix
  ansible.builtin.set_fact:
    _ssh_cmd: >-
      ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10
      -i {{ snapshot_flavor_dir }}/crypto/cluster-tool.key
      core@{{ _vm_mgmt_ip }}
    _scp_cmd: >-
      scp -o StrictHostKeyChecking=no
      -i {{ snapshot_flavor_dir }}/crypto/cluster-tool.key

- name: Read ingress CN from flavor
  ansible.builtin.slurp:
    src: "{{ snapshot_flavor_dir }}/crypto/ingress-cn.txt"
  register: _ingress_cn_raw

- name: Set ingress CN fact
  ansible.builtin.set_fact:
    _ingress_cn: "{{ _ingress_cn_raw.content | b64decode | trim }}"

# --- Copy crypto + pull-secret to VM ---

- name: Copy crypto directory to VM
  ansible.builtin.command:
    cmd: "{{ _scp_cmd }} -r {{ snapshot_flavor_dir }}/crypto core@{{ _vm_mgmt_ip }}:/tmp/crypto"

- name: Copy pull-secret to VM
  ansible.builtin.command:
    cmd: "{{ _scp_cmd }} {{ pull_secret_path }} core@{{ _vm_mgmt_ip }}:/tmp/crypto/pull-secret"

# --- Stop services ---

- name: Stop kubelet
  ansible.builtin.command:
    cmd: "{{ _ssh_cmd }} sudo systemctl stop kubelet"

- name: Wait for kubelet to stop
  ansible.builtin.pause:
    seconds: 5

- name: Stop crio
  ansible.builtin.command:
    cmd: "{{ _ssh_cmd }} sudo systemctl stop crio"

- name: Wait for crio to stop
  ansible.builtin.pause:
    seconds: 5

# --- Etcd + recert (block/always ensures etcd cleanup on failure) ---

- name: Run recert with standalone etcd
  block:
    - name: Detect etcd image in VM podman storage
      ansible.builtin.shell:
        cmd: >-
          {{ _ssh_cmd }} "sudo podman images --format '{{ '{{' }}.Repository{{ '}}' }}:{{ '{{' }}.Tag{{ '}}' }}'
          | grep etcd | head -1"
      register: _etcd_image
      changed_when: false

    - name: Start standalone etcd for recert
      ansible.builtin.shell:
        cmd: >-
          {{ _ssh_cmd }} "sudo podman run -d --name etcd-recert
          --network host --privileged
          --pull=never
          -v /var/lib/etcd:/store
          --entrypoint etcd
          {{ _etcd_image.stdout | trim }}
          --name editor --data-dir /store
          --listen-client-urls http://localhost:2379
          --advertise-client-urls http://localhost:2379"

    - name: Wait for etcd to be healthy
      ansible.builtin.shell:
        cmd: >-
          {{ _ssh_cmd }} "curl -sf http://localhost:2379/health"
      register: _etcd_health
      until: _etcd_health.rc == 0
      retries: 30
      delay: 2

    - name: Delete hypershift secrets from etcd
      ansible.builtin.shell:
        cmd: >-
          {{ _ssh_cmd }} "sudo podman exec etcd-recert etcdctl del '{{ item }}' {{ '--prefix' if item.endswith('/') else '' }}"
      loop:
        - /kubernetes.io/secrets/hypershift/
        - /kubernetes.io/validatingwebhookconfigurations/hypershift.openshift.io
        - /kubernetes.io/mutatingwebhookconfigurations/hypershift.openshift.io
        - /kubernetes.io/secrets/open-cluster-management-agent-addon/hypershift-addon-agent-metrics
        - /kubernetes.io/secrets/open-cluster-management-agent-addon/hypershift-addon-hub-kubeconfig
      failed_when: false

    - name: Run recert
      ansible.builtin.shell:
        cmd: >-
          {{ _ssh_cmd }} "sudo podman run --rm --name recert --pull=missing
          --network host --privileged
          -v /etc/kubernetes:/etc/kubernetes
          -v /var/lib/kubelet:/var/lib/kubelet
          -v /etc/machine-config-daemon:/etc/machine-config-daemon
          -v /etc/cni:/etc/cni
          -v /tmp/crypto:/tmp/crypto:ro
          {{ snapshot_recert_image }}
          --etcd-endpoint localhost:2379
          --crypto-dir /etc/kubernetes
          --crypto-dir /var/lib/kubelet
          --crypto-dir /etc/machine-config-daemon
          --crypto-dir /etc/cni
          --cluster-customization-dir /etc/kubernetes
          --cluster-customization-dir /var/lib/kubelet
          --cluster-customization-dir /etc/machine-config-daemon
          --use-key kube-apiserver-lb-signer:/tmp/crypto/lb-signer.key
          --use-key kube-apiserver-localhost-signer:/tmp/crypto/localhost-signer.key
          --use-key kube-apiserver-service-network-signer:/tmp/crypto/service-network-signer.key
          --use-key '{{ _ingress_cn }}:/tmp/crypto/ingress.key'
          --pull-secret /tmp/crypto/pull-secret
          --cluster-rename {{ ocp_cluster_name }}:{{ ocp_base_domain }}
          --hostname {{ ocp_vm_name }}
          --ip {{ ocp_node_ip }}
          --cn-san-replace api.{{ snapshot_source_cluster }}.{{ snapshot_source_domain }}:api.{{ ocp_cluster_name }}.{{ ocp_base_domain }}
          --cn-san-replace api-int.{{ snapshot_source_cluster }}.{{ snapshot_source_domain }}:api-int.{{ ocp_cluster_name }}.{{ ocp_base_domain }}
          --cn-san-replace '*.apps.{{ snapshot_source_cluster }}.{{ snapshot_source_domain }}:*.apps.{{ ocp_cluster_name }}.{{ ocp_base_domain }}'
          --cn-san-replace {{ snapshot_source_hostname }}:{{ ocp_vm_name }}
          --cn-san-replace system:node:{{ snapshot_source_hostname }},system:node:{{ ocp_vm_name }}
          --cn-san-replace {{ snapshot_source_ip }}:{{ ocp_node_ip }}
          --extend-expiration"
      register: _recert_result
      timeout: 600

  always:
    - name: Stop and remove etcd container
      ansible.builtin.shell:
        cmd: >-
          {{ _ssh_cmd }} "sudo podman stop etcd-recert 2>/dev/null; sudo podman rm etcd-recert 2>/dev/null"
      failed_when: false

- name: Start crio
  ansible.builtin.command:
    cmd: "{{ _ssh_cmd }} sudo systemctl start crio"

- name: Wait for crio
  ansible.builtin.pause:
    seconds: 3

- name: Start kubelet
  ansible.builtin.command:
    cmd: "{{ _ssh_cmd }} sudo systemctl start kubelet"

# --- Wait for cluster health ---

- name: Wait for API server healthy
  ansible.builtin.shell:
    cmd: >-
      {{ _ssh_cmd }} "curl -sk https://localhost:6443/healthz"
  register: _api_health
  until: _api_health.stdout | default('') == 'ok'
  retries: 60
  delay: 10

# --- Extract kubeconfig ---

- name: Ensure .kube directory exists
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    mode: "0700"

- name: Extract kubeconfig from VM
  ansible.builtin.shell:
    cmd: >-
      {{ _ssh_cmd }} "sudo cat /etc/kubernetes/static-pod-resources/kube-apiserver-certs/secrets/node-kubeconfigs/lb-ext.kubeconfig"
  register: _kubeconfig_content

- name: Write kubeconfig
  ansible.builtin.copy:
    content: "{{ _kubeconfig_content.stdout }}"
    dest: "/root/kubeconfig.{{ ocp_cluster_name }}"
    mode: "0600"

- name: Copy kubeconfig to default location
  ansible.builtin.copy:
    content: "{{ _kubeconfig_content.stdout }}"
    dest: /root/.kube/config
    mode: "0600"

# --- Wait for cluster ready ---

- name: Wait for node Ready
  ansible.builtin.shell:
    cmd: >-
      oc get nodes --no-headers 2>/dev/null | grep -q ' Ready'
  environment:
    KUBECONFIG: /root/.kube/config
  register: _node_ready
  until: _node_ready.rc == 0
  retries: 60
  delay: 30

- name: Wait for all ClusterOperators healthy
  ansible.builtin.shell:
    cmd: |
      oc get co -o json | python3 -c "
      import json, sys
      cos = json.load(sys.stdin)['items']
      for co in cos:
          name = co['metadata']['name']
          conditions = {c['type']: c['status'] for c in co.get('status', {}).get('conditions', [])}
          if conditions.get('Available') != 'True':
              print(f'NOT READY: {name} (Available={conditions.get(\"Available\")})')
              sys.exit(1)
          if conditions.get('Degraded') == 'True':
              print(f'DEGRADED: {name}')
              sys.exit(1)
      print(f'All {len(cos)} ClusterOperators healthy')
      "
  environment:
    KUBECONFIG: /root/.kube/config
  register: _co_health
  until: _co_health.rc == 0
  retries: 40
  delay: 30

- name: Report cluster status
  ansible.builtin.debug:
    msg: "{{ _co_health.stdout }}"
