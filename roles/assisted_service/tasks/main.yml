---
- name: Check if Assisted Service is already running with correct IP
  ansible.builtin.shell:
    cmd: podman exec assisted-installer-service env 2>/dev/null | grep -q "SERVICE_BASE_URL=http://{{ assisted_service_ip }}:8090"
  register: _ai_check
  failed_when: false
  changed_when: false

- name: Remove Assisted Service with wrong IP
  ansible.builtin.command:
    cmd: podman pod rm -f assisted-installer
  when: _ai_check.rc != 0
  register: _ai_remove
  failed_when: false
  changed_when: _ai_remove.rc == 0

- name: Remove stale aicli config files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ playbook_dir }}/pod.yml"
    - "{{ playbook_dir }}/configmap.yml"
    - /root/pod.yml
    - /root/configmap.yml
  when: _ai_check.rc != 0

- name: Wait for pod cleanup
  ansible.builtin.pause:
    seconds: 5
  when: _ai_remove is changed

- name: Deploy local Assisted Service
  ansible.builtin.command:
    cmd: aicli create onprem -P onprem_ip={{ assisted_service_ip }}
    chdir: /root
  when: _ai_check.rc != 0
  register: _ai_deploy
  until: _ai_deploy.rc == 0
  retries: 5
  delay: 15
  changed_when: true

- name: Filter OS_IMAGES to x86_64 for target version
  ansible.builtin.shell:
    cmd: |
      python3 -c "
      import json, yaml
      with open('/root/configmap.yml') as f:
          cm = yaml.safe_load(f)
      os_images = json.loads(cm['data']['OS_IMAGES'])
      filtered = [i for i in os_images
                  if i['cpu_architecture'] == 'x86_64'
                  and i['openshift_version'] == '{{ ocp_version }}']
      cm['data']['OS_IMAGES'] = json.dumps(filtered, separators=(',', ':'))
      with open('/root/configmap.yml', 'w') as f:
          yaml.safe_dump(cm, f, default_flow_style=False)
      print(f'Filtered OS_IMAGES from {len(os_images)} to {len(filtered)} entries')
      "
  register: _os_images_filter
  when: _ai_check.rc != 0
  changed_when: true

- name: Show OS_IMAGES filter result
  ansible.builtin.debug:
    msg: "{{ _os_images_filter.stdout }}"
  when: _os_images_filter is changed

- name: Recreate Assisted Service with filtered images
  ansible.builtin.shell:
    cmd: podman play kube --replace --configmap /root/configmap.yml /root/pod.yml
  when: _ai_check.rc != 0
  changed_when: true

- name: Wait for Assisted Service API
  ansible.builtin.uri:
    url: "{{ assisted_service_url }}/api/assisted-install/v2/clusters"
    method: GET
    status_code: [200]
  register: _ai_ready
  until: _ai_ready is not failed
  retries: 30
  delay: 10

- name: Check if lab name is already taken in Route 53
  ansible.builtin.shell:
    cmd: >-
      aws route53 list-hosted-zones-by-name
      --dns-name {{ dns_hosted_zone }}
      --query "HostedZones[0].Id"
      --output text
  environment:
    AWS_ACCESS_KEY_ID: "{{ aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws_secret_access_key }}"
    AWS_DEFAULT_REGION: us-east-1
  register: _r53_zone_id
  changed_when: false

- name: Check for existing OCP record under this lab name
  ansible.builtin.shell:
    cmd: >-
      aws route53 list-resource-record-sets
      --hosted-zone-id {{ _r53_zone_id.stdout | trim }}
      --query "ResourceRecordSets[?Name == 'api.{{ ocp_cluster_name }}.{{ ocp_base_domain }}.']|length(@)"
      --output text
  environment:
    AWS_ACCESS_KEY_ID: "{{ aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws_secret_access_key }}"
    AWS_DEFAULT_REGION: us-east-1
  register: _r53_existing
  changed_when: false

- name: Fail if lab name is already in use
  ansible.builtin.fail:
    msg: >-
      api.{{ ocp_cluster_name }}.{{ ocp_base_domain }} already exists in Route 53 —
      another lab is using LAB_NAME="{{ lab_name }}". Choose a different name.
  when: _r53_existing.stdout | int > 0

- name: Create OCP DNS records in Route 53
  ansible.builtin.shell:
    cmd: >-
      aws route53 change-resource-record-sets
      --hosted-zone-id {{ _r53_zone_id.stdout | trim }}
      --change-batch '{{ _r53_batch | to_json }}'
  vars:
    _r53_batch:
      Changes:
        - Action: UPSERT
          ResourceRecordSet:
            Name: "api.{{ ocp_cluster_name }}.{{ ocp_base_domain }}"
            Type: A
            TTL: 300
            ResourceRecords:
              - Value: "{{ ocp_dnat_ip }}"
        - Action: UPSERT
          ResourceRecordSet:
            Name: "api-int.{{ ocp_cluster_name }}.{{ ocp_base_domain }}"
            Type: A
            TTL: 300
            ResourceRecords:
              - Value: "{{ ocp_dnat_ip }}"
        - Action: UPSERT
          ResourceRecordSet:
            Name: "*.apps.{{ ocp_cluster_name }}.{{ ocp_base_domain }}"
            Type: A
            TTL: 300
            ResourceRecords:
              - Value: "{{ ocp_dnat_ip }}"
  environment:
    AWS_ACCESS_KEY_ID: "{{ aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws_secret_access_key }}"
    AWS_DEFAULT_REGION: us-east-1
  changed_when: true

- name: Configure DNS for OCP SNO
  ansible.builtin.copy:
    content: |
      address=/api.{{ ocp_cluster_name }}.{{ ocp_base_domain }}/{{ ocp_dnat_ip }}
      address=/.apps.{{ ocp_cluster_name }}.{{ ocp_base_domain }}/{{ ocp_dnat_ip }}
    dest: /etc/dnsmasq.d/ocp-sno.conf
    mode: "0644"
  notify: Restart dnsmasq

- name: Enable and start dnsmasq
  ansible.builtin.systemd:
    name: dnsmasq
    state: started
    enabled: true

- name: Add localhost as DNS resolver
  ansible.builtin.lineinfile:
    path: /etc/resolv.conf
    insertbefore: BOF
    line: "nameserver 127.0.0.1"
    state: present

- name: Report Assisted Service status
  ansible.builtin.debug:
    msg: "Assisted Service ready at {{ assisted_service_url }}, DNS configured for {{ ocp_cluster_name }}.{{ ocp_base_domain }}"
