---
- name: Clone osac-installer
  ansible.builtin.git:
    repo: "{{ osac_installer_repo }}"
    dest: "{{ osac_installer_dir }}"
    version: "{{ osac_installer_branch }}"
    force: true

- name: Initialize submodules
  ansible.builtin.command:
    cmd: git submodule update --init --recursive
    chdir: "{{ osac_installer_dir }}"
  register: _submodule_update
  changed_when: _submodule_update.stdout | length > 0

- name: Override osac-operator code in installer
  ansible.builtin.git:
    repo: "{{ osac_operator_repo }}"
    dest: "{{ osac_installer_dir }}/base/osac-operator"
    version: "{{ osac_operator_branch }}"
    force: true
  when: osac_operator_branch | default('') | length > 0

- name: Override fulfillment-service code in installer
  ansible.builtin.git:
    repo: "{{ fulfillment_service_repo }}"
    dest: "{{ osac_installer_dir }}/base/osac-fulfillment-service"
    version: "{{ fulfillment_service_branch }}"
    force: true
  when: fulfillment_service_branch | default('') | length > 0

- name: Rebuild osac CLI from fulfillment-service
  ansible.builtin.command:
    cmd: /usr/local/go/bin/go build -o /usr/local/bin/osac ./cmd/osac
    chdir: "{{ osac_installer_dir }}/base/osac-fulfillment-service"
  environment:
    GOPATH: /root/go
    GOCACHE: /root/.cache/go-build

- name: Determine values directory
  ansible.builtin.set_fact:
    _values_dir: "{{ snapshot_osac_values_file | dirname }}"

- name: Ensure values directory exists
  ansible.builtin.file:
    path: "{{ osac_installer_dir }}/{{ _values_dir }}"
    state: directory
    mode: "0755"

- name: Copy AAP license to values directory
  ansible.builtin.copy:
    src: "{{ osac_license_path }}"
    dest: "{{ osac_installer_dir }}/{{ _values_dir }}/license.zip"
    remote_src: true
    mode: "0644"

- name: Copy pull-secret to values directory
  ansible.builtin.copy:
    src: "{{ pull_secret_path }}"
    dest: "{{ osac_installer_dir }}/{{ _values_dir }}/pull-secret.json"
    remote_src: true
    mode: "0644"

- name: Override fulfillment-service image in values file
  ansible.builtin.shell:
    cmd: |
      sed -i 's|[a-zA-Z0-9./_-]*fulfillment-service:[a-zA-Z0-9._-]*|{{ fulfillment_service_image }}|g' \
        {{ osac_installer_dir }}/{{ snapshot_osac_values_file }}
  when: fulfillment_service_image | default('') | length > 0

- name: Override osac-operator image in values file
  ansible.builtin.shell:
    cmd: |
      REPO="{{ osac_operator_image | regex_replace(':[^/]+$', '') }}"
      TAG="{{ osac_operator_image | regex_search(':[^/]+$') | regex_replace('^:', '') | default('latest', true) }}"
      sed -i "s|[a-zA-Z0-9./_-]*osac-operator:[a-zA-Z0-9._-]*|{{ osac_operator_image }}|g" \
        {{ osac_installer_dir }}/{{ snapshot_osac_values_file }}
      sed -i "/repository: .*osac-operator/{s|repository: .*|repository: ${REPO}|;n;s/tag: .*/tag: ${TAG}/}" \
        {{ osac_installer_dir }}/{{ snapshot_osac_values_file }}
  when: osac_operator_image | default('') | length > 0

- name: Override osac-aap image in values file
  ansible.builtin.shell:
    cmd: |
      sed -i 's|[a-zA-Z0-9./_-]*osac-aap:[a-zA-Z0-9._-]*|{{ osac_aap_image }}|g' \
        {{ osac_installer_dir }}/{{ snapshot_osac_values_file }}
  when: osac_aap_image | default('') | length > 0

- name: Override AAP project git branch in values file
  ansible.builtin.shell:
    cmd: |
      sed -i 's|projectGitBranch: .*|projectGitBranch: "{{ osac_aap_branch }}"|' \
        {{ osac_installer_dir }}/{{ snapshot_osac_values_file }}
  when: osac_aap_branch | default('') | length > 0

- name: Disable osac-ui (image not published yet)
  ansible.builtin.shell:
    cmd: |
      if grep -q 'osac-ui' {{ osac_installer_dir }}/{{ snapshot_osac_values_file }}; then
        sed -i '/^ui:/,/^[a-z]/{s/enabled: true/enabled: false/}' \
          {{ osac_installer_dir }}/{{ snapshot_osac_values_file }}
      fi
  changed_when: false

- name: Scale down osac-ui deployment if running
  ansible.builtin.shell:
    cmd: oc scale deployment/osac-ui --replicas=0 -n {{ snapshot_osac_namespace }} 2>/dev/null || true
  environment:
    KUBECONFIG: /root/.kube/config
  changed_when: false

- name: Create socat env file for OCP ingress (port 9444 → OCP 443)
  ansible.builtin.copy:
    dest: /etc/netris-lab/socat/0.0.0.0-9444.env
    content: |
      BIND_IP=0.0.0.0
      PORT=9444
      TARGET_IP={{ ocp_dnat_ip }}
      TARGET_PORT=443

- name: Enable and start OCP ingress socat forwarder
  ansible.builtin.systemd:
    name: socat-forwarder@0.0.0.0-9444
    state: started
    enabled: true
    daemon_reload: true

# --- Update cluster-fulfillment-ig with lab's Netris config ---

- name: Discover Netris controller URL
  ansible.builtin.shell:
    cmd: kubectl get svc traefik -n kube-system -o jsonpath='{.spec.ports[?(@.name=="web")].nodePort}'
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: _traefik_nodeport
  changed_when: false

- name: Set Netris controller URL
  ansible.builtin.set_fact:
    _netris_ctl_url: "http://192.168.16.254:{{ _traefik_nodeport.stdout }}"

- name: Authenticate to Netris controller
  ansible.builtin.include_role:
    name: netris.controller.auth
  vars:
    netris_controller_url: "{{ _netris_ctl_url }}"

- name: Get Netris site
  ansible.builtin.include_role:
    name: netris.controller.site
  vars:
    netris_controller_url: "{{ _netris_ctl_url }}"
    site_state: read

- name: Get VPCs
  ansible.builtin.include_role:
    name: netris.controller.vpc
  vars:
    netris_controller_url: "{{ _netris_ctl_url }}"
    vpc_state: read

- name: Get server cluster templates
  ansible.builtin.include_role:
    name: netris.controller.server_cluster_template
  vars:
    netris_controller_url: "{{ _netris_ctl_url }}"
    server_cluster_template_state: list

- name: Build resource class map
  ansible.builtin.set_fact:
    _netris_resource_class_map: >-
      {"{{ caas_host_type_id }}":{"server_cluster_template_id":{{ netris_sct_by_name[caas_server_cluster_template_name].id }},"mgmt_interface":"ens4","vpc_interfaces":["ens5"]}}

- name: Update cluster-fulfillment-ig configmap with lab Netris config
  ansible.builtin.shell:
    cmd: |
      oc create configmap cluster-fulfillment-ig -n {{ snapshot_osac_namespace }} \
        --from-literal=NETWORK_CLASS=netris \
        --from-literal=NETWORK_STEPS_COLLECTION=netris.steps \
        --from-literal=EXTERNAL_ACCESS_BASE_DOMAIN={{ ocp_base_domain }} \
        --from-literal=EXTERNAL_ACCESS_SUPPORTED_BASE_DOMAINS={{ ocp_base_domain }} \
        --from-literal=EXTERNAL_ACCESS_API_INTERNAL_NETWORK=hypershift \
        --from-literal=HOSTED_CLUSTER_BASE_DOMAIN={{ ocp_base_domain }} \
        --from-literal=HOSTED_CLUSTER_CONTROLLER_AVAILABILITY_POLICY=SingleReplica \
        --from-literal=HOSTED_CLUSTER_INFRASTRUCTURE_AVAILABILITY_POLICY=SingleReplica \
        --from-literal=NETRIS_CONTROLLER_URL={{ _netris_ctl_url }} \
        --from-literal=NETRIS_USERNAME={{ netris_username }} \
        --from-literal=NETRIS_SITE_ID={{ netris_site_id }} \
        --from-literal=NETRIS_TENANT_ID=1 \
        --from-literal=NETRIS_TENANT_NAME=Admin \
        --from-literal=NETRIS_MGMT_VPC_ID={{ netris_vpc_by_name[ocp_vpc_name].id }} \
        --from-literal=NETRIS_MGMT_VPC_NAME={{ ocp_vpc_name }} \
        --from-literal='NETRIS_RESOURCE_CLASS_MAP={{ _netris_resource_class_map | to_json }}' \
        --from-literal=SERVER_MGMT_ROUTE_DESTINATION=192.168.16.0/20 \
        --from-literal=SERVER_MGMT_ROUTE_GATEWAY=192.168.16.1 \
        --from-literal=SERVER_SSH_BASTION_HOST=192.168.16.254 \
        --from-literal=SERVER_SSH_BASTION_USER=root \
        --from-literal=SERVER_SSH_USER=root \
        --from-literal=DNS_CLASS=dns.route53.dns \
        --from-literal=DNS_ZONE={{ dns_hosted_zone }} \
        --dry-run=client -o yaml | oc apply -f -
  environment:
    KUBECONFIG: /root/.kube/config

- name: Update cluster-fulfillment-ig secret with lab credentials and SSH keys
  ansible.builtin.shell:
    cmd: |
      oc create secret generic cluster-fulfillment-ig -n {{ snapshot_osac_namespace }} \
        --from-literal=NETRIS_PASSWORD={{ netris_password }} \
        --from-literal=AWS_ACCESS_KEY_ID={{ aws_access_key_id }} \
        --from-literal=AWS_SECRET_ACCESS_KEY={{ aws_secret_access_key }} \
        --from-file=SERVER_SSH_KEY={{ ssh_public_key_path | regex_replace('\.pub$', '') }} \
        --from-file=SERVER_SSH_BASTION_KEY={{ ssh_public_key_path | regex_replace('\.pub$', '') }} \
        --dry-run=client -o yaml | oc apply -f -
  environment:
    KUBECONFIG: /root/.kube/config
  no_log: true

- name: Report OSAC refresh status
  ansible.builtin.debug:
    msg: "OSAC refresh completed in namespace {{ snapshot_osac_namespace }}"
