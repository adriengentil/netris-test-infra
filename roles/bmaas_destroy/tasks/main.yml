---
- name: Delete BareMetalHost objects
  ansible.builtin.command:
    cmd: >
      oc delete baremetalhost -n {{ snapshot_osac_namespace | default(osac_namespace) }}
      -l osac.openshift.io/host-type={{ bmaas_host_type_id }} --ignore-not-found
  environment:
    KUBECONFIG: /root/.kube/config
  changed_when: true

- name: Delete BMC credentials secret
  ansible.builtin.command:
    cmd: oc delete secret bmaas-bmc-creds -n {{ snapshot_osac_namespace | default(osac_namespace) }} --ignore-not-found
  environment:
    KUBECONFIG: /root/.kube/config
  changed_when: true

- name: Delete sushy-tools Deployment, Service and SSH key secret
  ansible.builtin.command:
    cmd: oc delete {{ item }} -n {{ snapshot_osac_namespace | default(osac_namespace) }} --ignore-not-found
  loop:
    - "deployment/sushy-tools"
    - "service/sushy-tools"
    - "secret/bmaas-sushy-ssh-key"
  environment:
    KUBECONFIG: /root/.kube/config
  changed_when: true

- name: Get fulfillment internal API URL
  ansible.builtin.shell:
    cmd: oc get route fulfillment-internal-api -n {{ snapshot_osac_namespace | default(osac_namespace) }} -o jsonpath='{.status.ingress[0].host}'
  environment:
    KUBECONFIG: /root/.kube/config
  register: _fulfillment_host
  changed_when: false
  failed_when: false

- name: Get service account token
  ansible.builtin.shell:
    cmd: oc create token -n {{ snapshot_osac_namespace | default(osac_namespace) }} admin
  environment:
    KUBECONFIG: /root/.kube/config
  register: _sa_token
  changed_when: false
  failed_when: false
  when: _fulfillment_host.stdout | default('') | length > 0

- name: Delete bare-metal instance catalog item
  ansible.builtin.uri:
    url: "https://{{ _fulfillment_host.stdout }}/api/private/v1/baremetal_instance_catalog_items/{{ bmaas_catalog_item }}"
    method: DELETE
    headers:
      Authorization: "Bearer {{ _sa_token.stdout }}"
    validate_certs: false
    status_code: [200, 204, 404]
  when: _fulfillment_host.stdout | default('') | length > 0
  failed_when: false

- name: Delete bare-metal host type
  ansible.builtin.uri:
    url: "https://{{ _fulfillment_host.stdout }}/api/private/v1/host_types/{{ bmaas_host_type_id }}"
    method: DELETE
    headers:
      Authorization: "Bearer {{ _sa_token.stdout }}"
    validate_certs: false
    status_code: [200, 204, 404]
  when: _fulfillment_host.stdout | default('') | length > 0
  failed_when: false

- name: Find target VMs
  ansible.builtin.shell:
    cmd: virsh list --all --name | grep "{{ item }}"
  register: _target_vm_lookup
  changed_when: false
  failed_when: false
  loop: "{{ bmaas_target_vm_patterns }}"

- name: Build VM name list
  ansible.builtin.set_fact:
    bmaas_target_vms: "{{ _target_vm_lookup.results | selectattr('stdout_lines', 'defined') | selectattr('stdout_lines', 'ne', []) | map(attribute='stdout_lines') | map('first') | list }}"

- name: Get VM states
  ansible.builtin.shell:
    cmd: virsh domstate {{ item }}
  register: _vm_states
  changed_when: false
  failed_when: false
  loop: "{{ bmaas_target_vms }}"

- name: Stop target VMs
  ansible.builtin.command:
    cmd: virsh destroy {{ item.item }}
  when: item.stdout | default('') | trim == 'running'
  loop: "{{ _vm_states.results }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: true

- name: Untrust the sushy-tools SSH key on the hypervisor
  ansible.posix.authorized_key:
    user: root
    key: "{{ lookup('file', '/root/.ssh/bmaas_sushy_key.pub') }}"
    state: absent
  failed_when: false

- name: Remove sushy-tools SSH keypair
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /root/.ssh/bmaas_sushy_key
    - /root/.ssh/bmaas_sushy_key.pub

- name: Report BMaaS teardown complete
  ansible.builtin.debug:
    msg: "BMaaS teardown complete: BareMetalHosts/sushy-tools removed, target VMs stopped (not undefined — shared lab VMs)."
