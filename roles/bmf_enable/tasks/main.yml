---
- name: Find OCP server VM
  ansible.builtin.shell:
    cmd: virsh list --all --name | grep "{{ ocp_vm_name_pattern }}"
  register: _bmf_vm_lookup
  changed_when: false

- name: Get mgmt NIC MAC address
  ansible.builtin.shell:
    cmd: virsh domiflist {{ _bmf_vm_lookup.stdout_lines[0] }} | grep bridge | awk '{print $5}'
  register: _bmf_mgmt_mac
  changed_when: false

- name: Render Provisioning CR
  ansible.builtin.template:
    src: provisioning.yml.j2
    dest: /tmp/bmf-provisioning.yml
    mode: "0600"

- name: Apply Provisioning CR
  ansible.builtin.command:
    cmd: oc apply -f /tmp/bmf-provisioning.yml
  environment:
    KUBECONFIG: /root/.kube/config
  register: _provisioning_apply
  changed_when: "'created' in _provisioning_apply.stdout or 'configured' in _provisioning_apply.stdout"
  until: _provisioning_apply.rc == 0
  retries: 10
  delay: 15

- name: Wait for Ironic pods to appear
  ansible.builtin.shell:
    cmd: oc get pods -n openshift-machine-api --no-headers | grep -i ironic | wc -l
  environment:
    KUBECONFIG: /root/.kube/config
  register: _ironic_pod_count
  until: _ironic_pod_count.stdout | int > 0
  retries: 30
  delay: 15
  changed_when: false

- name: Wait for Ironic pods to be Running
  ansible.builtin.shell:
    cmd: >
      oc get pods -n openshift-machine-api --no-headers | grep -i ironic |
      awk '{print $3}' | grep -v Running | wc -l
  environment:
    KUBECONFIG: /root/.kube/config
  register: _ironic_not_running
  until: _ironic_not_running.stdout | int == 0
  retries: 30
  delay: 15
  changed_when: false

- name: Render real inventory.yaml
  ansible.builtin.template:
    src: inventory.yaml.j2
    dest: /tmp/bmf-inventory.yaml
    mode: "0600"

- name: Render real management.yaml
  ansible.builtin.template:
    src: management.yaml.j2
    dest: /tmp/bmf-management.yaml
    mode: "0600"

- name: Render real clouds.yaml
  ansible.builtin.template:
    src: clouds.yaml.j2
    dest: /tmp/bmf-clouds.yaml
    mode: "0600"

- name: Apply real bmf-operator secrets
  ansible.builtin.shell:
    cmd: >
      oc create secret generic {{ item.name }}
      --from-file={{ item.key }}=/tmp/{{ item.file }}
      -n {{ snapshot_osac_namespace | default(osac_namespace) }}
      --dry-run=client -o yaml | oc apply -f -
  environment:
    KUBECONFIG: /root/.kube/config
  loop:
    - { name: "osac-inventory-config", key: "inventory.yaml", file: "bmf-inventory.yaml" }
    - { name: "osac-management-config", key: "management.yaml", file: "bmf-management.yaml" }
    - { name: "osac-os-clouds", key: "clouds.yaml", file: "bmf-clouds.yaml" }
  changed_when: false
  register: _secrets_result
  until: _secrets_result.rc == 0
  retries: 10
  delay: 15

- name: Find bmf-operator deployment
  ansible.builtin.shell:
    cmd: oc get deploy -n {{ snapshot_osac_namespace | default(osac_namespace) }} -o name | grep -i bmf
  environment:
    KUBECONFIG: /root/.kube/config
  register: _bmf_deploy_lookup
  until: _bmf_deploy_lookup.stdout | length > 0
  retries: 20
  delay: 15
  changed_when: false

- name: Wait for bmf-operator rollout
  ansible.builtin.command:
    cmd: >
      oc rollout status {{ _bmf_deploy_lookup.stdout_lines[0] }}
      -n {{ snapshot_osac_namespace | default(osac_namespace) }} --timeout=180s
  environment:
    KUBECONFIG: /root/.kube/config
  changed_when: false

- name: Report bmf/Ironic ready
  ansible.builtin.debug:
    msg: >-
      bmf operator and OpenShift's baremetal operator (Ironic/ironic-inspector) are both live
      in {{ snapshot_osac_namespace | default(osac_namespace) }} / openshift-machine-api.
