---
- name: Find target VMs
  ansible.builtin.shell:
    cmd: virsh list --all --name | grep "{{ item }}"
  register: _target_vm_lookup
  changed_when: false
  loop: "{{ bmaas_target_vm_patterns }}"

- name: Build VM name list
  ansible.builtin.set_fact:
    bmaas_target_vms: "{{ _target_vm_lookup.results | map(attribute='stdout_lines') | map('first') | list }}"

- name: Get VM states
  ansible.builtin.shell:
    cmd: virsh domstate {{ item }}
  register: _vm_states
  changed_when: false
  loop: "{{ bmaas_target_vms }}"

- name: Shut down running VMs
  ansible.builtin.command:
    cmd: virsh destroy {{ item.item }}
  when: item.stdout | trim == 'running'
  loop: "{{ _vm_states.results }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: true

- name: Get current vCPU count
  ansible.builtin.shell:
    cmd: virsh vcpucount {{ item }} --config --maximum
  register: _current_vcpus
  changed_when: false
  loop: "{{ bmaas_target_vms }}"

- name: Set maximum vCPUs
  ansible.builtin.command:
    cmd: virsh setvcpus {{ item.item }} {{ bmaas_target_vcpu }} --config --maximum
  when: item.stdout | int != bmaas_target_vcpu | int
  loop: "{{ _current_vcpus.results }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: true

- name: Set vCPUs
  ansible.builtin.command:
    cmd: virsh setvcpus {{ item.item }} {{ bmaas_target_vcpu }} --config
  when: item.stdout | int != bmaas_target_vcpu | int
  loop: "{{ _current_vcpus.results }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: true

- name: Get current max memory
  ansible.builtin.shell:
    cmd: virsh dommemstat {{ item }} | awk '/actual/{print int($2/1024)}'
  register: _current_memory
  changed_when: false
  loop: "{{ bmaas_target_vms }}"

- name: Set maximum memory
  ansible.builtin.command:
    cmd: virsh setmaxmem {{ item.item }} {{ bmaas_target_memory_mb }}M --config
  when: item.stdout | int != bmaas_target_memory_mb | int
  loop: "{{ _current_memory.results }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: true

- name: Set memory
  ansible.builtin.command:
    cmd: virsh setmem {{ item.item }} {{ bmaas_target_memory_mb }}M --config
  when: item.stdout | int != bmaas_target_memory_mb | int
  loop: "{{ _current_memory.results }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: true

- name: Detach all existing disks
  ansible.builtin.shell:
    cmd: |
      for target in $(virsh domblklist {{ item }} | awk 'NR>2 && NF>1 {print $1}'); do
        virsh detach-disk {{ item }} "$target" --config 2>/dev/null || true
      done
  loop: "{{ bmaas_target_vms }}"
  changed_when: true

- name: Create blank disk for each VM
  ansible.builtin.command:
    cmd: qemu-img create -f qcow2 /var/lib/libvirt/images/{{ item }}-bmaas-disk.qcow2 {{ bmaas_target_disk_gb }}G
    creates: /var/lib/libvirt/images/{{ item }}-bmaas-disk.qcow2
  loop: "{{ bmaas_target_vms }}"

- name: Check if boot disk is attached
  ansible.builtin.shell:
    cmd: virsh domblklist {{ item }} | grep -q '{{ item }}-bmaas-disk.qcow2'
  register: _boot_disk_attached
  failed_when: false
  changed_when: false
  loop: "{{ bmaas_target_vms }}"

- name: Attach boot disk
  ansible.builtin.command:
    cmd: virsh attach-disk {{ item.item }} /var/lib/libvirt/images/{{ item.item }}-bmaas-disk.qcow2 vda --persistent --subdriver qcow2
  when: item.rc != 0
  loop: "{{ _boot_disk_attached.results }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: true

- name: Report BMaaS target hosts prepared
  ansible.builtin.debug:
    msg: >-
      BMaaS discovery: {{ bmaas_target_vms | length }} VMs repurposed as bare-metal targets
      ({{ bmaas_target_vcpu }} vCPU, {{ bmaas_target_memory_mb }}MB RAM, {{ bmaas_target_disk_gb }}GB disk),
      left powered off — sushy-tools/Ironic will control power and virtual media from here.
